<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>302班潔牙＆座位清理＆漱口檢查表</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8fb;color:#24303c;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:28px 24px 60px}
h1{text-align:center;font-size:clamp(30px,5vw,54px);margin:12px 0 36px}
.card{background:white;border-radius:28px;padding:30px;margin:0 0 28px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.today{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:clamp(25px,4vw,42px);font-weight:800}
.controls{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:clamp(22px,3vw,34px);font-weight:700}
input[type=checkbox]{width:46px;height:46px;accent-color:#1688f8}
input[type=number]{font-size:30px;width:150px;padding:12px;border:3px solid #bdc8d1;border-radius:18px;text-align:center}
button{font-size:25px;padding:14px 28px;border:0;border-radius:18px;cursor:pointer}
.primary{background:#e4f2ff}.danger{background:#fde4e4}
.stats{display:grid;gap:16px;text-align:center;font-size:clamp(23px,3vw,34px);font-weight:700}
.students{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.student{border:3px solid #dbe3e9;background:#fff;border-radius:26px;padding:24px 12px;text-align:center}
.num{font-size:34px;font-weight:800;margin-bottom:18px}
.checks{display:flex;justify-content:center;gap:24px}
.check{display:grid;gap:10px;justify-items:center;font-size:38px}
.hint{text-align:center;color:#647280;margin-top:20px;font-size:18px}
@media(max-width:850px){.students{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.wrap{padding:18px 14px 45px}.card{padding:22px 14px}.checks{gap:16px}.student{padding:20px 8px}}
/* 午間提醒大字彈窗 */
.alarm-overlay{position:fixed;inset:0;background:rgba(14,25,40,.82);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.alarm-overlay[hidden]{display:none}
.alarm-dialog{width:min(680px,100%);background:#fff;border-radius:30px;padding:35px 24px;text-align:center;box-shadow:0 16px 70px #0005}
.alarm-heading{font-size:clamp(32px,6vw,54px);font-weight:900}
.alarm-time{font-size:clamp(45px,9vw,78px);font-weight:900;color:#116ec9;margin:10px 0}
.alarm-message{font-size:clamp(32px,6vw,56px);font-weight:850;line-height:1.65;white-space:pre-line}
.alarm-close{margin-top:26px;background:#1688f8;color:white;font-size:clamp(27px,4vw,38px);font-weight:800;min-width:220px}
</style>
</head>
<body>
<div class="wrap">
<h1>302班 潔牙＆座位清理＆漱口檢查表</h1>

<div class="card today">
  <span>今天要完成：</span>
  <label><input id="showTooth" type="checkbox" checked> 🦷 潔牙</label>
  <label><input id="showSeat" type="checkbox" checked> 🧹 座位清理</label>
  <label><input id="showRinse" type="checkbox" checked> 💧 漱口</label>
</div>

<div class="card controls">
  <label>班級人數 <input id="count" type="number" min="1" max="60" value="27"></label>
  <button class="primary" id="apply">套用</button>
  <button class="danger" id="clear">全部清空</button>
</div>

<div class="card stats">
  <div>🦷 <span id="toothStat">0 / 27</span> 完成潔牙</div>
  <div>🧹 <span id="seatStat">0 / 27</span> 完成座位清理</div>
  <div>💧 <span id="rinseStat">0 / 27</span> 完成漱口</div>
</div>


<div class="card" style="text-align:center">
  <div style="font-size:clamp(23px,3vw,34px);font-weight:800;margin-bottom:18px">⏰ 午間提醒鬧鐘</div>
  <div id="clock" style="font-size:32px;font-weight:800;margin-bottom:16px">--:--:--</div>
  <button class="primary" id="soundBtn" type="button">🔔 開啟鬧鐘聲音</button>
  <button class="primary" id="testBtn" type="button">測試鬧鐘</button>
  <div id="nextAlarm" class="hint" aria-live="polite"></div>
  <p class="hint">提醒時間：12:15、12:20、週三／週五 12:25、週一／週二／週四 12:28。請保持此網頁開啟，手機勿靜音。</p>
</div>

<div id="students" class="students"></div>
<p class="hint">同一天重新整理或關閉網頁，紀錄會保留；隔天第一次開啟時會自動清空勾選。</p>
</div>

<div id="alarmOverlay" class="alarm-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="alarmTitle">
  <div class="alarm-dialog">
    <div id="alarmTitle" class="alarm-heading">🔔 302班午間提醒</div>
    <div id="alarmTime" class="alarm-time">12:15</div>
    <div id="alarmMessage" class="alarm-message"></div>
    <button id="alarmClose" class="alarm-close" type="button">✅ 知道了</button>
  </div>
</div>
<script>
const STORE="class302_tracker_v2";
const DATEKEY="class302_tracker_date";
const todayKey=()=>{
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};

let state={count:27, tooth:[], seat:[], rinse:[]};

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORE)||"null");
    if(saved && Number(saved.count)) state=saved;
  }catch(e){}
  const lastDate=localStorage.getItem(DATEKEY);
  const now=todayKey();

  // 新的一天：只清除學生三項完成紀錄，保留班級人數。
  if(lastDate!==now){
    state.tooth=[]; state.seat=[]; state.rinse=[];
    localStorage.setItem(DATEKEY,now);
    save();
  }
}

function save(){
  localStorage.setItem(STORE,JSON.stringify(state));
  localStorage.setItem(DATEKEY,todayKey());
}

function render(){
  document.getElementById("count").value=state.count;
  const box=document.getElementById("students");
  box.innerHTML="";
  for(let i=1;i<=state.count;i++){
    const el=document.createElement("div");
    el.className="student";
    el.innerHTML=`
      <div class="num">${i}號</div>
      <div class="checks">
        ${oneCheck("tooth",i,"🦷",state.tooth.includes(i))}
        ${oneCheck("seat",i,"🧹",state.seat.includes(i))}
        ${oneCheck("rinse",i,"💧",state.rinse.includes(i))}
      </div>`;
    box.appendChild(el);
  }
  bindChecks();
  updateStats();
}

function oneCheck(type,n,icon,checked){
  return `<label class="check"><span>${icon}</span><input type="checkbox" data-type="${type}" data-n="${n}" ${checked?"checked":""}></label>`;
}

function bindChecks(){
  document.querySelectorAll(".student input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const type=cb.dataset.type, n=Number(cb.dataset.n);
      const set=new Set(state[type]);
      cb.checked ? set.add(n) : set.delete(n);
      state[type]=[...set].sort((a,b)=>a-b);
      save(); updateStats();
    });
  });
}

function updateStats(){
  document.getElementById("toothStat").textContent=`${state.tooth.length} / ${state.count}`;
  document.getElementById("seatStat").textContent=`${state.seat.length} / ${state.count}`;
  document.getElementById("rinseStat").textContent=`${state.rinse.length} / ${state.count}`;
}

document.getElementById("apply").addEventListener("click",()=>{
  const n=Math.max(1,Math.min(60,Number(document.getElementById("count").value)||27));
  state.count=n;
  for(const k of ["tooth","seat","rinse"]) state[k]=state[k].filter(x=>x<=n);
  save(); render();
});

document.getElementById("clear").addEventListener("click",()=>{
  if(confirm("確定要清空今天所有勾選紀錄嗎？")){
    state.tooth=[]; state.seat=[]; state.rinse=[];
    save(); render();
  }
});


// 午間鬧鐘：使用電腦或手機本地時間，週日=0，週一=1
let alarmEnabled=false;
let audioCtx=null;
const alarms=[
  {days:[1,2,3,4,5],time:"12:15",msg:"🗑️ 倒廚餘\n🪥 刷牙\n🧹 打掃"},
  {days:[1,2,3,4,5],time:"12:20",msg:"🍱 抬餐桶"},
  {days:[3,5],time:"12:25",msg:"🎒 準備放學"},
  {days:[1,2,4],time:"12:28",msg:"🎒 準備放學"}
];
const alarmOverlay=document.getElementById("alarmOverlay");
const soundBtn=document.getElementById("soundBtn");
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.frequency.value=880;gain.gain.value=.15;
    osc.start();osc.stop(audioCtx.currentTime+.38);
  }catch(e){console.warn("無法播放提示音",e)}
}
function enableAlarm(){
  alarmEnabled=true;
  soundBtn.textContent="🔔 鬧鐘聲音已開啟";
  beep();
  updateNextAlarm();
}
function showReminder(a){
  document.getElementById("alarmTime").textContent=a.time;
  document.getElementById("alarmMessage").textContent=a.msg;
  alarmOverlay.hidden=false;
  beep();setTimeout(beep,650);setTimeout(beep,1300);
  document.getElementById("alarmClose").focus();
}
document.getElementById("alarmClose").addEventListener("click",()=>{alarmOverlay.hidden=true});
function updateNextAlarm(){
  const label=document.getElementById("nextAlarm");
  if(!alarmEnabled){label.textContent="請先點選「開啟鬧鐘聲音」";return}
  const now=new Date();
  let next=null;
  for(let i=0;i<8;i++){
    const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    for(const a of alarms){
      if(!a.days.includes(day.getDay()))continue;
      const [h,m]=a.time.split(":").map(Number);
      const when=new Date(day.getFullYear(),day.getMonth(),day.getDate(),h,m);
      if(when<=now)continue;
      if(!next||when<next.when)next={when,a};
    }
  }
  label.textContent=next?`下一次提醒：${["週日","週一","週二","週三","週四","週五","週六"][next.when.getDay()]} ${next.a.time} ${next.a.msg.replaceAll("\n","、")}`:"";
}
function tick(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0"),ss=String(d.getSeconds()).padStart(2,"0");
  document.getElementById("clock").textContent=`${hh}:${mm}:${ss}`;
  if(!alarmEnabled)return;
  const now=`${hh}:${mm}`;
  for(const a of alarms){
    if(!a.days.includes(d.getDay())||a.time!==now)continue;
    const key=`class302_alarm_${todayKey()}_${a.time}`;
    if(sessionStorage.getItem(key)==="1")continue;
    sessionStorage.setItem(key,"1");
    showReminder(a);
  }
  if(ss==="00")updateNextAlarm();
}
soundBtn.addEventListener("click",enableAlarm);
document.getElementById("testBtn").addEventListener("click",()=>{
  if(!alarmEnabled)enableAlarm();
  showReminder({time:"測試",msg:"🔔 鬧鐘測試成功\n🗑️ 倒廚餘\n🪥 刷牙\n🧹 打掃"});
});
setInterval(tick,1000);
tick();
updateNextAlarm();

load();
render();
</script>
</body>
</html>
